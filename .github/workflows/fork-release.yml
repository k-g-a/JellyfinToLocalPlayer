name: Build fork release

on:
  push:
    branches:
      - fork-release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM_EMBED_RELEASE: "2026.07.18"
  UPSTREAM_EMBED_ASSET: etlp-python-embed-win32.zip

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Download pinned embedded Python runtime
        shell: pwsh
        run: |
          $url = "https://github.com/kjtsune/embyToLocalPlayer/releases/download/$env:UPSTREAM_EMBED_RELEASE/$env:UPSTREAM_EMBED_ASSET"
          Invoke-WebRequest -Uri $url -OutFile upstream-embed.zip

      - name: Build and validate archives
        shell: pwsh
        run: |
          python .github/release/build_release.py --embedded-python-archive upstream-embed.zip --output artifacts
          python -m compileall -q embyToLocalPlayer.py utils

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $date = Get-Date -AsUTC -Format "yyyy.MM.dd"
          $tag = "fork-$date.${{ github.run_number }}"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          @"
          Windows packages built from fork-release commit $shortSha.

          - embyToLocalPlayer.zip: source package for an installed system Python. Install requirements.txt first.
          - etlp-python-embed-win32.zip: portable package with the pinned upstream embedded Python runtime.
          - The Jellyfin JavaScript Injector script is at user_script/embyToLocalPlayer.injector.js in both archives.

          Embedded runtime source: kjtsune/embyToLocalPlayer release $env:UPSTREAM_EMBED_RELEASE.
          "@ | Set-Content -Path release-notes.md

          $assets = Get-ChildItem artifacts/*.zip | ForEach-Object { $_.FullName }
          if (gh release view $tag 2>$null) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --target $env:GITHUB_SHA --title "JellyfinToLocalPlayer $tag" --notes-file release-notes.md
          }
