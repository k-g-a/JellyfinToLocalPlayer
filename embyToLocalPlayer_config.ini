##################################################################
### v v # # # # # # # # # Basic Configuration # # # # # # # # # # # # v v ###

[exe]
# Paths for each player, feel free to delete the ones you don't need. Remember which player to use is set in the next item below.
mpv = C:\Green\mpv\mpv.exe
mpve = C:\Green\mpvnet\mpvnet.exe
pot = C:\Program Files\DAUM\PotPlayer\PotPlayerMini64.exe
hc = C:\Green\MPC-HC\mpc-hc64.exe
be = C:\Green\MPC-BE\mpc-be64.exe
vlc = C:\Green\vlc\vlc.exe
iina = /Applications/IINA.app/Contents/MacOS/iina-cli
mpvm = /Applications/mpv.app/Contents/MacOS/mpv
vlcm = /Applications/VLC.app/Contents/MacOS/VLC
linux_mpv = mpv
linux_vlc = vlc
flat_mpv = /var/lib/flatpak/exports/bin/io.mpv.Mpv
others = Other players generally work too, they just don't report playback progress.

[emby]
# Select the player, fill in the player name from above, e.g. mpv
player = pot

# Whether to report progress after closing the player
update_progress = yes

# Try to auto-fullscreen
fullscreen = yes

##################################################################
### v v # # # # # # # # Path Translation Settings # # # # # # # # # # # # v v ###

# [Optional] Emby plays via http by default, which works fine; you can leave this alone and try it first. If the file is local, enabling translation gives a better experience.
# Enabling translation (disk-reading mode) requires the file to be local or mounted.
# [Optional] No extra config is needed if the Emby server is also on this machine. Remember to enable disk-reading mode in the userscript, see FAQ for details.

[src]
# Path translation principle: get the file path shown in emby > find a matching path prefix from the emby-side prefix list below > remove the prefix and replace it with the corresponding local prefix in [dst].
# .bat has an assisted configuration program, press 4.
# Remember to enable disk-reading mode in the userscript, see FAQ for details
# Matched in order; matching stops as soon as an emby-side prefix succeeds.
# a b c d etc. have no special meaning, they're just used to pair up src and dst entries.
# The configuration below converts /mnt/disk1/movie/movie name (2000)/movie.mkv
# into E:/movie/movie name (2000)/movie.mkv

# Emby-side directory prefix list.
a = /mnt/disk1
b = /mnt/disk2/media

[dst]
# Local directory prefix list.
a = E:
b = F:\media

############################################################################
# v v v # # # # # # # # # The following config is optional and can all be deleted # # # # # # # # # # # v v v #

##################################################################
### v v # # # # # Playlist (continuous playback | multi-episode reporting) Settings # # # # # # v v ###

[playlist]

# Keywords of domains for which the playlist should be enabled, comma separated. Leave empty or delete to disable. (all enabled by default)
enable_host = local, 127.0, 192.168, 192-168-, example.com:8096, . ,

# Try to keep the same version when moving to the next episode; on failure, the playlist will be disabled, which may affect S0 mixed insertion.
# Write the differing fields between filenames of different versions, separated by |. (actually a regex, case-insensitive)
version_filter = 720|1080|2160|4k|remux|hevc|265|264|sdr|hdr|dv|vision|baha|cr|global|house|vcb|mkv|mp4|简.|.语|内.|..字幕|....组|..@..

# Entry count limit, must be greater than 0, -1 uses the preset value.
item_limit = -1

# When pot or vlc (Linux/macOS) play a network stream episode with external subtitles, the next episode can't load subtitles, so the playlist is disabled.
# In this case, whether to do simple continuous playback using the strategy below.
# Strategy: when playback progress exceeds 0.9, close the player, which will automatically launch the player to play the next episode.
http_sub_auto_next_ep = no

##################################################################
### v v # # # # # # # # # Other Settings # # # # # # # # # # # # # v v ###

[dev]

# When no subtitle is selected, try loading an external subtitle following these rules in order, rules separated by commas.
# These strings are part of the display name shown when selecting subtitles in a browser.
subtitle_priority = 中英特效, 双语特效, 简中特效, 简体特效, 特效, 中上, 中英, 双语, 简, simp, 中, chi, ass, srt, sup, und, (

# When a video has multiple versions, try to select a version based on filename keywords. Takes effect when no version is selected, e.g. clicking play from the home page. Also used to fill in episode numbers when matching the same version for the next episode fails.
# Keywords separated by commas, earlier keywords take priority, example: remux,x265,web-dl
version_prefer = MyFavorGroup, GoodVersion, isOkVersion

# Whether to use the system proxy; enabling this overrides the custom proxy below, enabled by default.
use_system_proxy = yes

# The script's http proxy, e.g. http://127.0.0.1:7890.
# If using OpenClash it may be slow for unknown reasons, you can try CFW or a transparent proxy instead.
script_proxy =

# The player's http proxy, limited to: mpv mpv.net iina.
player_proxy =

# Select the player based on whether the server-side video file address contains certain characters, example below, separators are : , ;
# mpv: the path shown in /emby/ or a keyword works too ; hc: anime, if multiple keywords separate with commas ; vlc: .iso, __bdmv, __bdmv is a special value that matches a bdmv folder ;
player_by_path =

# Keywords of server domains for which the video stream redirect link should be checked and cached before playback, comma separated.
# Applies to servers with separated front/back ends etc. where the video stream redirects. Enabling this arbitrarily adds an extra check request, making things slower instead.
# For non-hardcoded-subtitle network video streams, this saves two or more redirect requests, improving startup speed. (fetches the next episode's redirect when progress exceeds half, mpv only)
# If the redirect only replaces the domain, it's recommended to use the local redirect feature, see FAQ > Hidden Features > Simulate 302 Redirect.
redirect_check_host =

# Cached redirect links may expire. Whether to set source domain keywords and expiry times that will become invalid. Restart the script after modifying the config. Separators are : ;
# e.g. example.com expires in 30 minutes, test.org expires in 10 hours. Example: example:30; test.org:600;
redirect_expire_minute =

# Directly play the path or URL inside strm, avoiding an Emby relay. Keywords of domains for which to enable this feature, comma separated.
# This requires the player to be able to directly access that path or URL. If you have a mounted drive, you can configure the path translation above.
strm_direct_host =

# Set a static mpv pipe path or name; setting this may affect reporting. E.g. mpvpipe or /tmp/mpvsocket
mpv_input_ipc_server =

# Whether to kill extra processes on first startup. If this is disabled, end the old process in Task Manager first if you need to restart the script.
kill_process_at_start = yes

# Force disk-reading mode when the server-side path contains the following prefixes, ignoring the userscript setting. Comma separated, e.g.: /mnt/disk1, /mnt/disk2
force_disk_mode_path =

# Mask domains and keys in the log
mix_log = yes

# Log path, can be ./log.txt or an absolute path. Resets when it exceeds 10MB. Leave empty to disable.
log_file = ./log.txt

# Whether to check file existence during path translation, and try NFC/NFD conversion when the path contains special characters. This adds detection time.
path_check = no

# Whether to skip certificate verification for https requests made by the script, used to remove self-signed certificate warnings.
skip_certificate_verify = no

# Whether to prettify the title, showing Emby's info in the player title, limited to: mpv pot.
pretty_title = yes

# By default the player is not restricted to a single instance; if reporting errors occur when playing multiple videos at once, you can try switching to mpv.
one_instance_mode = no

# Keywords of domains for which to enable real-time reporting of currently playing data, comma separated. mpv only. This feature is unstable, disabling is recommended.
playing_feedback_host =

# When a video has multiple versions, whether to use the version_prefer parameter above to filter and fill in episodes missing a manually specified version.
version_prefer_for_playlist = yes

##################################################################
## v v # # # # # # # bgm.tv Settings, see FAQ for details # # # # # # # # v v ###

[bangumi]

# Keyword of the domain for which to enable this feature, comma separated, leave empty to disable this feature. Plex is not supported.
# E.g.: localhost, 127.0.0.1, 192.168., example.com:8096, to enable for all just fill in a single dot: .
enable_host =

# bgm username or UID. If a username is set, only the username can be filled in.
# The UID is the numeric part of @123456 on the profile page or the URL bgm.tv/user/123456. E.g.: 123456
username =

# Token, note the expiry date. Generate at: https://next.bgm.tv/demo/access-token
# E.g.: hsdkxI4l7tUhMgo1MskxRn35qqFl5Ie5cCJ
access_token =

# Whether the watch history is visible only to yourself. Fill in "no" to make it public.
private = yes

# Only sync entries of a specific genre in emby. Usually no need to change, it's a regex. Note this is genre, not tag.
genres = 动画|anim

##################################################################
### v v # # # # # # # Simkl Settings, see FAQ for details # # # # # # # # v v ###

[simkl]

# Keyword of the domain for which to enable this feature, comma separated, leave empty to disable this feature. E.g.: example.com:8096, plex.direct, 32400
enable_host =

# When creating the app, fill in the redirect link as: http://localhost:58000/simkl_auth
# Bottom of the developer page, app details page -> Client ID
client_id =

# Bottom of the developer page, app details page -> Client Secret
client_secret =

##################################################################
### v v # # # # # # # Trakt Settings, see FAQ for details # # # # # # # # v v ###

[trakt]

# Keyword of the domain for which to enable this feature, comma separated, leave empty to disable this feature. E.g.: example.com:8096, plex.direct, 32400
enable_host =

# Trakt username, note this is not the display name.
user_name =

# When creating the app, fill in the redirect link as: http://localhost:58000/trakt_auth
# Created trakt app details page -> Client ID
client_id =

# Created trakt app details page -> Client Secret
client_secret =

# Start the script -> created trakt app details page -> click the Authorize button -> after re-confirmation you'll be prompted that verification succeeded.

[server]
# Optional local HTTP port. Restart the instance after changing it.
port = 58000
# Optional button title suffix. Blank or missing uses [emby] player.
# Example: MPC-HC / madVR -> Play in MPC-HC / madVR
title =
